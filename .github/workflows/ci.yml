name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Simulated dry-run
        run: pnpm bot:simulate --steps 50 --poll-seconds 0
        env:
          DB_PATH: ${{ runner.temp }}/bot.sqlite3
          KILL_SWITCH_PATH: ${{ runner.temp }}/KILL
          SMA_SHORT: 2
          SMA_LONG: 4

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auto-trade:ci .
